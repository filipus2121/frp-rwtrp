<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RWTRP Broadcast — Checker</title>
  <link rel="stylesheet" href="/vendor/titillium-web/400.css" />
  <link rel="stylesheet" href="/vendor/titillium-web/600.css" />
  <link rel="stylesheet" href="/vendor/titillium-web/700.css" />
  <link rel="stylesheet" href="/vendor/titillium-web/900.css" />
  <link rel="stylesheet" href="/vendor/jetbrains-mono/400.css" />
  <link rel="stylesheet" href="/vendor/jetbrains-mono/700.css" />
  <link rel="stylesheet" href="/vendor/jetbrains-mono/800.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/checker.css" />
</head>
<body class="checker">
  <div class="conn-banner" id="connBanner">⚠ СОЕДИНЕНИЕ ПОТЕРЯНО — ПЕРЕПОДКЛЮЧЕНИЕ…</div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">R</div>
      <div>
        <div class="brand-name">RWTRP</div>
        <div class="brand-sub">BROADCAST</div>
      </div>
    </div>

    <div class="race-meta">
      <div class="race-name" id="raceName">—</div>
      <div class="race-sub">
        <span id="raceTrack">—</span>
        <span id="raceSession">—</span>
        <span id="raceWeather">—</span>
      </div>
    </div>

    <div class="topbar-spacer"></div>

    <div class="tb-block">
      <span class="tb-label">LAP</span>
      <span class="tb-value" id="lapCounter">–<small>/–</small></span>
    </div>
    <div class="tb-block">
      <span class="tb-label">SESSION CLOCK</span>
      <span class="tb-value" id="sessionClock">00:00:00</span>
    </div>
    <div class="tb-block">
      <span class="tb-label">FASTEST LAP</span>
      <span class="tb-value" id="fastestLap" style="font-size:15px">—</span>
    </div>
    <div class="tb-block">
      <span class="tb-label">STATUS</span>
      <span class="tb-live off" id="liveBadge"><span class="pulse-dot"></span><span id="liveText">STANDBY</span></span>
    </div>
    <div class="flag-banner flag-none" id="flagBanner">
      <span class="flag-ico" id="flagIco" style="background:#2a303e"></span>
      <span id="flagText">NO FLAG</span>
    </div>
  </header>

  <main class="stage">
    <!-- LEFT: timing tower -->
    <section class="col col-left">
      <div class="tower-head">
        <span>POS</span><span>DRIVER</span><span>GAP</span><span>INTERVAL</span><span>TYRE</span>
      </div>
      <div class="tower" id="tower"></div>
    </section>

    <!-- CENTER: track map -->
    <section class="col col-center">
      <div class="track-wrap">
        <canvas id="trackCanvas"></canvas>
        <div class="track-hud">
          <span class="chip" id="hudTrack">—</span>
          <span class="chip" id="hudDrs">DRS: —</span>
        </div>
        <div class="sector-chips" id="sectorChips"></div>
        <div class="track-legend">
          <span><b>●</b> <span id="legendLeader">Leader</span></span>
          <span>DRS open</span>
          <span>◐ pit</span>
          <span>✕ retired</span>
        </div>
      </div>

      <!-- scene overlays -->
      <div class="scene-overlay hidden" id="sceneResults"></div>
      <div class="scene-overlay hidden" id="sceneStandings"></div>
      <div class="scene-overlay hidden" id="sceneAnalysis"></div>
      <div class="scene-overlay hidden" id="sceneFeed"></div>
    </section>

    <!-- RIGHT: feed -->
    <section class="col col-right">
      <div class="panel-tabs">
        <button class="active" data-tab="feed">RACE FEED</button>
        <button data-tab="radio">RADIO</button>
      </div>
      <div class="panel-body" id="feedBody"></div>
      <div class="panel-body hidden" id="radioBody"></div>
    </section>
  </main>

  <!-- lower-third overlays -->
  <div class="lower-third" id="lowerThird"></div>

  <!-- ticker -->
  <footer class="ticker">
    <div class="ticker-label">RWTRP <span style="font-weight:700">· LIVE</span></div>
    <div class="ticker-track"><div class="ticker-inner" id="tickerInner"></div></div>
  </footer>

  <script type="module" src="/js/checker.js"></script>
</body>
</html>
